name: Web build and tests

# Called by pr.yml (the PR checks) and web.yml (pushes to develop, manual and weekly runs; web.yml
# builds the site it deploys itself). Builds the app once, then runs ci/web-tests.sh in parallel
# shards on that build.
on:
  workflow_call:
    inputs:
      tests:
        description: Run the Chromium test shards
        type: boolean
        default: true
      subtitles:
        description: Also run the subtitles test (Whisper, a 2.2 GB model download)
        type: boolean
        default: false
      full:
        description: The full versions of the tests that have a shorter one (FULL=1 for ci/web-tests.sh)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      # The shards are the numbered cases of ci/web-tests.sh ("  1)", "  2)", ...).
      - name: Test shards
        id: shards
        shell: bash
        run: |
          set -euo pipefail
          SHARDS=$(grep -oE '^  [0-9]+\)' ci/web-tests.sh | tr -dc '0-9\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')
          [ "$SHARDS" != "[]" ] || { echo "::error::no numbered shards in ci/web-tests.sh"; exit 1; }
          echo "shards=$SHARDS" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/scripts/requirements-ci.txt
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg fonts-dejavu-core
      # Every t('<Hebrew>') in web/src has its English (as ci/i18n_check.py for the app).
      - name: Every string has its English
        run: python3 ci/web_i18n_check.py
      - name: Build
        working-directory: web
        run: |
          pip install --quiet -r scripts/requirements-ci.txt
          npm ci
          npm run build
      # No web chunk grew past shared/perf/baseline.json (a PR that grows one on purpose updates it).
      - name: Chunk sizes
        run: python3 ci/perf_check.py web-size
      # The pure tests (no browser, a few seconds): a failure shows before the shards start.
      - name: Unit tests
        run: bash ci/web-tests.sh unit
      # The beta web app ("ONIT Beta", built from develop) builds too, so a beta-only failure shows here.
      - name: Build the beta
        working-directory: web
        run: ONIT_CHANNEL=beta npx vite build --outDir dist-beta --emptyOutDir --logLevel warn
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          compression-level: 3

  test:
    name: test (shard ${{ matrix.shard }})
    if: inputs.tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-test-env
      - name: Chromium tests
        # Under the job's limit: a hang fails this step (the results still upload) instead of cancelling the job.
        timeout-minutes: 25
        env:
          FULL: ${{ inputs.full && '1' || '' }}
        run: bash ci/web-tests.sh ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-results-${{ matrix.shard }}
          path: /tmp/web-results
          retention-days: 14
          if-no-files-found: ignore

  # Speech recognition on the CPU path is slow and downloads the Whisper model every time.
  subtitles:
    if: inputs.tests && inputs.subtitles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-test-env
      - name: Test subtitles in Chromium (Whisper, the model from Hugging Face)
        timeout-minutes: 50
        env:
          FULL: ${{ inputs.full && '1' || '' }}
        run: bash ci/web-tests.sh subs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-results-subtitles
          path: /tmp/web-results
          retention-days: 14
          if-no-files-found: ignore
