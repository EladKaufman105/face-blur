name: Web build and tests

# Called by pr.yml (the PR checks) and web.yml (main: build and deploy; manual and weekly runs: tests).
# Builds the app once, then runs ci/web-tests.sh in parallel shards on that build.
on:
  workflow_call:
    inputs:
      tests:
        description: Run the Chromium test shards
        type: boolean
        default: true
      subtitles:
        description: Also run the subtitles test (Whisper, a 1.4 GB model download)
        type: boolean
        default: false
      pages:
        description: Upload the build as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/scripts/requirements-ci.txt
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg fonts-dejavu-core
      - name: Build
        working-directory: web
        run: |
          pip install --quiet -r scripts/requirements-ci.txt
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          compression-level: 3
      - uses: actions/upload-pages-artifact@v3
        if: inputs.pages
        with:
          path: web/dist

  test:
    name: test (shard ${{ matrix.shard }})
    if: inputs.tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-test-env
      - name: Chromium tests
        run: bash ci/web-tests.sh ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-results-${{ matrix.shard }}
          path: /tmp/web-results
          retention-days: 14
          if-no-files-found: ignore

  # Speech recognition on the CPU path is slow and downloads the Whisper model every time.
  subtitles:
    if: inputs.tests && inputs.subtitles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-test-env
      - name: Test subtitles in Chromium (Whisper, the model from Hugging Face)
        run: bash ci/web-tests.sh subs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-results-subtitles
          path: /tmp/web-results
          retention-days: 14
          if-no-files-found: ignore
