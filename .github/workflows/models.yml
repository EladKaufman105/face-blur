name: Subtitle models

# Builds the on-device Hebrew subtitle model and publishes it as a release asset for the app to
# download: ivrit.ai's Hebrew fine-tune of Whisper large-v3-turbo (Apache-2.0), quantized to q5_0.
# With "model: multilingual" it instead mirrors the stock multilingual Whisper large-v3-turbo q5_0
# (MIT) from Hugging Face at a pinned revision into the same release, so the app downloads every
# model from this repository. Manual only. The asset's size and sha256 are in the log: they go into
# app/src/main/assets/model-registry.json (a PR), which the app checks every download against.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Which model to publish
        type: choice
        options: [ivrit, multilingual]
        default: ivrit
      revision:
        description: Hugging Face commit of ggerganov/whisper.cpp to mirror (multilingual only; 40 hex)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WHISPER_TAG: v1.9.5
      MODEL_TAG: models-1
    steps:
      - uses: actions/checkout@v4

      - name: Mirror multilingual Whisper
        if: inputs.model == 'multilingual'
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::revision must be a 40-hex commit"; exit 1; }
          mkdir -p out
          curl -sSfL --retry 3 -o out/ggml-large-v3-turbo-q5_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/$REVISION/ggml-large-v3-turbo-q5_0.bin"
          ls -la out
          stat -c '%s' out/ggml-large-v3-turbo-q5_0.bin
          sha256sum out/*.bin

      - name: Build whisper.cpp quantizer
        if: inputs.model != 'multilingual'
        shell: bash
        run: |
          git clone -q --depth 1 -b "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF > /dev/null
          cmake --build wcpp/build -j 4 --target whisper-quantize > /dev/null
          ls -la wcpp/build/bin

      - name: Quantize ivrit.ai turbo
        if: inputs.model != 'multilingual'
        shell: bash
        run: |
          mkdir -p out
          curl -sSfL --retry 3 -o ivrit-f16.bin https://huggingface.co/ivrit-ai/whisper-large-v3-turbo-ggml/resolve/main/ggml-model.bin
          ls -la ivrit-f16.bin
          wcpp/build/bin/whisper-quantize ivrit-f16.bin out/ggml-ivrit-large-v3-turbo-q5_0.bin q5_0 | tail -3
          rm ivrit-f16.bin
          ls -la out
          sha256sum out/*.bin

      # A published model is pinned by its sha256 in the app's registry: never replace one.
      - name: Refuse to replace a published model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          for f in out/*.bin; do
            if printf '%s\n' "$have" | grep -qxF "$(basename "$f")"; then
              echo "::error::$(basename "$f") is already in $MODEL_TAG: publish a new models-N release instead"; exit 1
            fi
          done

      - name: Publish model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MODEL_TAG }}
          name: Subtitle models
          body: "Whisper models for on-device subtitles. ivrit.ai whisper-large-v3-turbo (Apache-2.0, https://huggingface.co/ivrit-ai/whisper-large-v3-turbo), quantized to q5_0 with whisper.cpp ${{ env.WHISPER_TAG }}."
          files: out/*.bin
          overwrite_files: false
          make_latest: false
