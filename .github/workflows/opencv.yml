name: OpenCV minimal

# OpenCV's Java library with only the modules EDITIT uses: core, imgproc, imgcodecs (JPEG
# only), dnn (ONNX models), objdetect (YuNet), video (optical flow) and what they depend on.
# Static C++ runtime, 16 KB page alignment. Built for arm64-v8a (phones) and x86_64 (the CI
# emulator) and pushed to the opencv-min branch, which the app build copies into jniLibs.
on:
  push:
    branches: [opencv-src]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opencv:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENCV_TAG: 4.10.0
    steps:
      - uses: actions/checkout@v4

      # OpenCV 4.10's binding generator predates the runner's newest Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ninja-build > /dev/null
          git clone -q --depth 1 -b "$OPENCV_TAG" https://github.com/opencv/opencv ../opencv
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p out logs
          for ABI in arm64-v8a x86_64; do
            cmake -S ../opencv -B "../b-$ABI" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DPYTHON_DEFAULT_EXECUTABLE="$(which python3)" -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,--gc-sections" \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_FAT_JAVA_LIB=ON \
              -DBUILD_LIST=core,imgproc,imgcodecs,dnn,objdetect,calib3d,features2d,flann,video,java,java_bindings_generator \
              -DBUILD_JAVA=ON -DANDROID_PROJECTS_BUILD_TYPE=GRADLE -DBUILD_ANDROID_PROJECTS=OFF -DBUILD_ANDROID_EXAMPLES=OFF -DBUILD_ANDROID_SERVICE=OFF \
              -DBUILD_KOTLIN_EXTENSIONS=OFF \
              -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_DOCS=OFF -DBUILD_opencv_apps=OFF \
              -DWITH_OPENCL=OFF -DWITH_VULKAN=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF -DWITH_EIGEN=OFF \
              -DWITH_PNG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_OPENJPEG=OFF -DWITH_JASPER=OFF \
              -DWITH_OPENEXR=OFF -DWITH_AVIF=OFF -DWITH_IMGCODEC_HDR=OFF -DWITH_IMGCODEC_SUNRASTER=OFF \
              -DWITH_IMGCODEC_PXM=OFF -DWITH_IMGCODEC_PFM=OFF -DWITH_JPEG=ON -DBUILD_JPEG=ON \
              -DWITH_PROTOBUF=ON -DBUILD_PROTOBUF=ON -DWITH_ANDROID_MEDIANDK=OFF \
              -DOPENCV_JAVA_LIB_NAME_SUFFIX=_min -DWITH_ADE=OFF -DCV_TRACE=OFF -DWITH_FLATBUFFERS=OFF -DCPU_DISPATCH= \
              > "logs/cmake-$ABI.log" 2>&1 || { tail -120 "logs/cmake-$ABI.log"; exit 1; }
            grep -A3 "OpenCV modules:" "logs/cmake-$ABI.log" || true
            if ! cmake --build "../b-$ABI" -j 4 --target opencv_java > "logs/build-$ABI.log" 2>&1; then
              tail -60 "logs/build-$ABI.log"
              echo "-- full build"
              cmake --build "../b-$ABI" -j 4 > "logs/build-$ABI-all.log" 2>&1 || { tail -120 "logs/build-$ABI-all.log"; exit 1; }
            fi
            so=$(find "../b-$ABI" -name 'libopencv_java_min.so' | head -1)
            mkdir -p "out/$ABI"
            "$STRIP" --strip-unneeded -o "out/$ABI/libopencv_java_min.so" "$so"
            readelf -d "out/$ABI/libopencv_java_min.so" | grep -E "NEEDED|SONAME"
            readelf -lW "out/$ABI/libopencv_java_min.so" | grep LOAD
          done
          ls -la out/*

      - name: Publish to opencv-min
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp -r logs out/ 2>/dev/null || true
          cat > out/README.md <<EOF
          OpenCV $OPENCV_TAG built by .github/workflows/opencv.yml (branch opencv-src): core, imgproc,
          imgcodecs (JPEG), dnn, objdetect, calib3d, features2d, flann, video and the Java bindings,
          static libc++, 16 KB pages, no TFLite importer, no extra CPU dispatch variants (the app computes in fp32). Apache-2.0, https://github.com/opencv/opencv
          EOF
          cd out
          git init -q -b opencv-min
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "OpenCV $OPENCV_TAG minimal (${{ github.sha }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" opencv-min
