name: Web app

# main: build and deploy to Pages, no tests (develop -> main merges were tested in their PR).
# Pull requests run the tests (pr.yml); a push to develop doesn't repeat them.
# Manual and weekly runs build and run every test, including the slow subtitles one.
on:
  push:
    branches: [main, ci/optimize-workflows] # TEMP-VERIFY: remove in the last commit
    paths:
      - 'web/**'
      # What web/scripts/copy-assets.mjs takes from the Android app.
      - 'app/src/main/assets/retinaface_mv2.onnx'
      - 'app/src/main/assets/human_segmentation_pphumanseg_2023mar.onnx'
      - 'app/src/main/assets/fonts/**'
      - 'app/src/main/assets/sfx/**'
      - '.github/workflows/web.yml'
      - '.github/workflows/web-tests.yml'
      - 'ci/web-tests.sh'
      - '.github/actions/**'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: ./.github/workflows/web-tests.yml
    with:
      tests: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }} # TEMP-VERIFY
      subtitles: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }} # TEMP-VERIFY
      pages: ${{ github.ref == 'refs/heads/main' }}

  # Only main goes to the site.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
