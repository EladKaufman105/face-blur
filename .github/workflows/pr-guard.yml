name: PR guard

# PRs into main come only from develop (a release) or hotfix/*. Its own workflow so that
# changing a PR's base ("edited") re-runs only this check, not the builds in pr.yml.
# The job name is a check the branch rulesets require: keep it as it is.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Into main only from develop or hotfix/*
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = main ] && [ "$HEAD_REF" != develop ] && [[ "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::PRs into main come only from develop (release) or hotfix/*, not from '$HEAD_REF'. Open this PR into develop."
            exit 1
          fi
          echo "$HEAD_REF -> $BASE_REF: ok"
