name: Build APK

# push to develop: a beta ("ONIT Beta", its own app id, pre-release, never "latest"), and with it
#   the release candidate (RC): the next release's APK (app id com.elad.faceblur), built in the same
#   run with the same tools, kept 90 days as the artifact "release-candidate".
# push to main: a release. When main's tree is a tested beta's (ci/promote-check.sh), that beta's
#   RC is checked and released as it is ("promote", no build, no emulator). Otherwise, and always
#   for a hotfix, the full path: build, emulator e2e, publish, as before.
# Sunday, and manual runs with "full": every instrumented test (also @Weekly ones) and every
#   EndToEndTest clip. These runs publish, tag and version nothing.
# Both publish only what passed the emulator end-to-end test.
#
# plan           what this run does: promote, full or test (on main: ci/promote-check.sh plan)
# promote        main, promote only: the RC, checked again, released
# build-release  arm64 release APKs: the beta and the RC (develop) or the release (main)   \
# build-test     x86_64 test APKs for the emulator                                          | in
# avd            AVD + booted snapshot, cached (created once)                               | parallel
# android        the PR check on the merged tree: debug build, JVM unit tests               /
# e2e            4 emulator shards over the instrumented tests, in parallel
# publish        needs every job above
on:
  push:
    branches: [main, develop]
    # Paths that don't go into the APK (the web app has its own workflow). Keep this list the
    # same as EXCLUDES in ci/promote-check.sh: a release may differ from its beta only here.
    # pr.yml checks that they match.
    paths-ignore:
      - '.github/workflows/models.yml'
      - '.github/workflows/web.yml'
      - '.github/workflows/web-tests.yml'
      - '.github/actions/**'
      - 'ci/web-tests.sh'
      - 'ci/web_i18n_check.py'
      - 'ci/publish-pages.sh'
      - 'ci/pages-build.sh'
      - 'web/**'
      # The models web/ shares; the app downloads them from pinned commits, never from here.
      - 'models/**'
      - 'docs/**'
      - '.claude/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/parity-hint.yml'
      - '.github/workflows/conflict-alert.yml'
      - 'ci/conflict-alert.sh'
      - '.github/rulesets/**'
  workflow_dispatch:
    inputs:
      full:
        description: Test only, everything (also @Weekly tests, all EndToEndTest clips). Publishes nothing.
        type: boolean
        default: false
      force_full:
        description: On main, build and run the emulator e2e instead of promoting the beta's release candidate.
        type: boolean
        default: false
  schedule:
    # Sunday: the full instrumented suite on develop (the default branch).
    - cron: '17 3 * * 0'

permissions:
  contents: read

# One publishing run at a time per branch, so two runs don't take the same version. Test-only
# runs (weekly, manual "full") queue on their own.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.full) && 'e2e-full' || 'release' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The cached AVD's key: API level, image, profile and emulator flags. Change it with them.
  AVD_KEY: avd-33-google_apis-x86_64-pixel_6-swiftshader-4c4096M-v1
  # Pushes to develop (the default branch, whose caches every branch reads) save the Gradle cache
  # and ccache; everything else, main too, only reads them.
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

jobs:
  # What this run does. mode: promote (main, the RC passed every check), full (build, e2e, publish)
  # or test (weekly / manual "full": build and e2e only).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      kinds: ${{ steps.plan.outputs.kinds }}
      e2e_full: ${{ steps.plan.outputs.e2e_full }}
      beta: ${{ steps.plan.outputs.beta }}
      rc_run: ${{ steps.plan.outputs.rc_run }}
      rc_sha256: ${{ steps.plan.outputs.rc_sha256 }}
      rc_version_code: ${{ steps.plan.outputs.rc_version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # History and tags for ci/version.sh; blob:none skips the big data branches' files.
          fetch-depth: 0
          filter: blob:none

      # The version from the git tags: main a release, develop a beta, anything else a dev build.
      # On main, ci/version.sh fails a re-run of a released commit ("already released") here.
      - name: Plan
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ONLY: ${{ github.event_name == 'schedule' || inputs.full == true }}
          FORCE_FULL: ${{ inputs.force_full == true }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [ "$TEST_ONLY" != true ] && [ "$GITHUB_REF" = refs/heads/develop ]; then
            V=$(bash ci/version.sh beta)
            # A re-run of a run whose commit is in a beta already (its own, or a newer commit's
            # that took over) stops here: no second beta of the same change.
            bash ci/release-guard.sh beta "$V"
          fi
          {
            if [ "$TEST_ONLY" = true ]; then
              echo "mode=test"; echo "version=0.0.0-dev"; echo 'kinds=["dev"]'; echo "e2e_full=true"
            else
              echo "e2e_full=false"
              case "$GITHUB_REF" in
                refs/heads/main) bash ci/promote-check.sh plan HEAD; echo 'kinds=["release"]' ;;
                refs/heads/develop) echo "mode=full"; echo "version=$V"; echo 'kinds=["beta","rc"]' ;;
                *) echo "mode=full"; echo "version=0.0.0-dev"; echo 'kinds=["dev"]' ;;
              esac
            fi
          } | tee -a "$GITHUB_OUTPUT"

      - name: Download the release candidate
        id: rc
        if: steps.plan.outputs.mode == 'promote'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: rc
          run-id: ${{ steps.plan.outputs.rc_run }}
          github-token: ${{ github.token }}

      - name: Check the release candidate
        id: verify
        if: steps.plan.outputs.mode == 'promote' && steps.rc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CODE: ${{ steps.plan.outputs.rc_version_code }}
          SHA: ${{ steps.plan.outputs.rc_sha256 }}
        run: |
          set -euo pipefail
          ls -la rc
          [ "$(ls rc)" = "ONIT-$VERSION.apk" ] || { echo "::error::rc/ should hold only ONIT-$VERSION.apk"; exit 1; }
          bash ci/verify-rc.sh "rc/ONIT-$VERSION.apk" "$VERSION" "$CODE" "$SHA"

      # Anything not verified falls back to the full path, never to a weaker publish.
      - name: Decide
        id: decide
        shell: bash
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERIFY: ${{ steps.verify.outcome }}
          REASON: ${{ steps.plan.outputs.reason }}
          BETA: ${{ steps.plan.outputs.beta }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [ "$MODE" = promote ] && [ "$VERIFY" != success ]; then
            MODE=full
            REASON="the release candidate couldn't be downloaded or failed its checks"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            promote) MSG="Promote: $VERSION is the release candidate of $BETA, released without a rebuild." ;;
            full) MSG="Full path: build, emulator e2e, publish ($VERSION).${REASON:+ Why: $REASON}" ;;
            *) MSG="Test only: every instrumented test, nothing published." ;;
          esac
          echo "::notice::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

  # The release from the beta's release candidate: the same bytes the beta's run built next to the
  # APKs its emulator shards tested. ci/verify-rc.sh checked them in plan; here only the hash.
  promote:
    needs: plan
    if: needs.plan.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # ci/release-guard.sh
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: out
          run-id: ${{ needs.plan.outputs.rc_run }}
          github-token: ${{ github.token }}

      - name: The bytes plan checked
        shell: bash
        env:
          SHA: ${{ needs.plan.outputs.rc_sha256 }}
        run: |
          set -euo pipefail
          [ "$(ls out)" = "ONIT-$VERSION.apk" ]
          echo "$SHA  out/ONIT-$VERSION.apk" | sha256sum -c -

      # A re-run of only this job skips plan's "already released" check: the tag must still be free.
      - name: The version is still this run's
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release-guard.sh new "v$VERSION"

      # GitHub has refused a create for a moment ("Resource not accessible by integration"): a
      # failed first try gets one more, a minute later (see "Try again" below).
      - name: Publish release
        id: try1
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &promote-release
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ONIT ${{ env.VERSION }}
          body: "ONIT ${{ env.VERSION }}, build ${{ needs.plan.outputs.rc_version_code }} (the Android versionCode). APK for arm64 (vivo X300 Pro). Commit ${{ github.sha }}. The release candidate of beta ${{ needs.plan.outputs.beta }}, built and tested in run ${{ needs.plan.outputs.rc_run }}."
          files: out/*.apk
          make_latest: true
          generate_release_notes: true

      - name: Wait, then check the tag again
        if: steps.try1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          bash ci/release-guard.sh retry "v$VERSION"

      - name: Publish release (second try)
        if: steps.try1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *promote-release

  # The shipped APKs: arm64, minified, signed. Start at once, don't wait for the emulator.
  # beta: -Plabs ("ONIT Beta"); rc: the next release's APK (develop); release: main's full path.
  build-release:
    name: build-release (${{ matrix.kind }})
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        kind: ${{ fromJSON(needs.plan.outputs.kinds) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v5

      - name: Version and name
        shell: bash
        run: |
          set -euo pipefail
          LABS=""
          case "$KIND" in
            beta) NAME="ONIT-Beta-$VERSION"; LABS="-Plabs=true" ;;
            # The release it will be: X.Y.Z-beta.N -> X.Y.Z (ci/version.sh, tested in ci/test_version.sh).
            rc) VERSION="${VERSION%-beta.*}"; NAME="ONIT-$VERSION" ;;
            release) NAME="ONIT-$VERSION" ;;
            *) NAME="ONIT-dev-$GITHUB_RUN_NUMBER" ;;
          esac
          { echo "APK_VERSION=$VERSION"; echo "APK_NAME=$NAME"; echo "LABS=$LABS"; } | tee -a "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ env.SAVE_CACHES != 'true' || matrix.kind == 'rc' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: ccache
        id: ccache
        run: bash ci/ccache.sh setup
      - name: Restore the ccache
        id: ccache-restore
        if: steps.ccache.outputs.ok == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-release-arm64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-${{ steps.ccache.outputs.week }}
          restore-keys: |
            ccache-release-arm64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-
            ccache-release-arm64-

      - name: Build release APK
        shell: bash
        run: |
          bash ci/fetch-whisper.sh
          bash ci/fetch-opencv.sh
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease ${LABS:+"$LABS"} "-PversionName=$APK_VERSION" --configuration-cache --stacktrace 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: bash ci/ccache.sh stats
      - name: Save the ccache
        if: success() && steps.ccache.outputs.ok == 'true' && steps.ccache-restore.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true' && matrix.kind != 'rc'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/$APK_NAME.apk"
          sha256sum out/*.apk

      # The beta and release APKs are kept a week, in case the release asset's upload fails. The RC is kept 90 days, until main
      # promotes it.
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.kind == 'rc' && 'release-candidate' || 'release-apk' }}
          path: out/*.apk
          retention-days: ${{ matrix.kind == 'rc' && 90 || 7 }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-release-${{ matrix.kind }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

  # The test APKs for the x86_64 emulator, built once and shared by every shard.
  build-test:
    needs: plan
    if: needs.plan.outputs.mode != 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Every string has its English
        run: python3 ci/i18n_check.py

      # The app's models as the registry pins them (ci/fetch-models.sh), kept while the registry
      # doesn't change; fetch-models.sh skips the files already here and checked.
      - name: Restore the test models
        id: models-restore
        uses: actions/cache/restore@v5
        with:
          # The registry's files only (ggml-tiny.bin is downloaded each run by fetch-test-media.sh).
          path: |
            app/src/androidTest/assets/models/*.onnx
            app/src/androidTest/assets/models/*.tflite
          key: test-models-${{ hashFiles('app/src/main/assets/model-registry.json') }}

      # The test clips and models download in the background while the build is set up. OpenCV
      # first: they all fetch into this repository's FETCH_HEAD, one after another. whisper.cpp is
      # a clone of its own.
      - name: Fetch sources, and the test media in the background
        shell: bash
        run: |
          bash ci/fetch-opencv.sh
          ( { bash ci/fetch-test-media.sh && bash ci/fetch-models.sh; } > fetch-test-media.log 2>&1; echo $? > fetch-test-media.status ) &
          bash ci/fetch-whisper.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ env.SAVE_CACHES != 'true' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: ccache
        id: ccache
        run: bash ci/ccache.sh setup
      - name: Restore the ccache
        id: ccache-restore
        if: steps.ccache.outputs.ok == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-test-x86_64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-${{ steps.ccache.outputs.week }}
          restore-keys: |
            ccache-test-x86_64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-
            ccache-test-x86_64-

      - name: Wait for the test media
        shell: bash
        run: |
          timeout 600 bash -c 'until [ -f fetch-test-media.status ]; do sleep 1; done'
          cat fetch-test-media.log
          [ "$(cat fetch-test-media.status)" = 0 ]

      - name: Save the test models
        if: steps.models-restore.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            app/src/androidTest/assets/models/*.onnx
            app/src/androidTest/assets/models/*.tflite
          key: ${{ steps.models-restore.outputs.cache-primary-key }}

      - name: Build test APKs (x86_64)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          # The release build too (minified by R8): the self-test shard runs it after its tests.
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease -PabiFilters=x86_64 --configuration-cache --stacktrace 2>&1 | tee e2e-build.log

      - name: ccache stats
        if: always()
        run: bash ci/ccache.sh stats
      - name: Save the ccache
        if: success() && steps.ccache.outputs.ok == 'true' && steps.ccache-restore.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v6
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-test
          path: |
            e2e-build.log
            fetch-test-media.log
          retention-days: 14
          if-no-files-found: ignore

  # The emulator image and its booted snapshot, created once and cached (API level, image and
  # emulator flags are the key). The shards boot from it instead of creating an AVD.
  avd:
    needs: plan
    if: needs.plan.outputs.mode != 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - id: cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}
          lookup-only: true

      - name: Create the AVD and its snapshot
        if: steps.cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "Generated the AVD snapshot for caching."

  # The same check as a PR's android job (pr.yml), on the merged tree: the arm64 debug build, the
  # instrumented tests compile, the JVM unit tests. On develop it also saves the ccache PRs read.
  android:
    name: android (debug build, unit tests)
    needs: plan
    if: needs.plan.outputs.mode != 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: ccache
        id: ccache
        run: bash ci/ccache.sh setup
      - name: Restore the ccache
        id: ccache-restore
        if: steps.ccache.outputs.ok == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-debug-arm64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-${{ steps.ccache.outputs.week }}
          restore-keys: |
            ccache-debug-arm64-${{ hashFiles('ci/fetch-whisper.sh', 'app/build.gradle.kts', 'app/src/main/cpp/*.*', 'app/src/main/cpp/lame/**') }}-
            ccache-debug-arm64-

      - name: Debug build and unit tests
        shell: bash
        run: |
          bash ci/fetch-whisper.sh
          bash ci/fetch-opencv.sh
          chmod +x gradlew
          ./gradlew assembleDebug compileDebugAndroidTestKotlin testDebugUnitTest --configuration-cache --stacktrace

      - name: ccache stats
        if: always()
        run: bash ci/ccache.sh stats
      - name: Save the ccache
        if: success() && steps.ccache.outputs.ok == 'true' && steps.ccache-restore.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload the unit test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-report
          path: app/build/reports/tests
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: [plan, build-test, avd]
    if: needs.plan.outputs.mode != 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced by the measured class times (seconds, run 45828954854, less the tests moved
          # to @Weekly or the JVM). EndToEndTest is split in two by clip run (-e e2eShards 2,
          # run index % 2 == part): on a merge part 0 is portrait_rot90, headpose pixelate and
          # classroom60 720p30, part 1 stress_cuts, classroom sensitive and walk fast (sensitivity
          # 50%, a 10 s clip at 12 fps, estimated ~20 s); with full=true the two parts cover all 13
          # runs. The release self-test (~75 s) runs in one shard. The model tests (ModelGateTest
          # ~80, ModelDownloaderTest a few s, estimates) go with the lightest.
          # 1: EndToEndTest part 1 (~150 with walk fast, estimated), LabsTest (~70)
          - shard: 1
            part: 1
            classes: com.elad.faceblur.EndToEndTest,com.elad.faceblur.LabsTest
            selftest: 0
          # 2: EndToEndTest part 0 (~120), SubtitlesTest (~50), the model tests (~80)
          - shard: 2
            part: 0
            classes: com.elad.faceblur.EndToEndTest,com.elad.faceblur.SubtitlesTest,com.elad.faceblur.models.ModelGateTest,com.elad.faceblur.models.ModelDownloaderTest
            selftest: 0
          # 3: EditorScreenTest (~120), SelfieTest (~15, estimated), the self-test (~75)
          - shard: 3
            part: 0
            classes: com.elad.faceblur.EditorScreenTest,com.elad.faceblur.SelfieTest
            selftest: 1
          # 4: ProjectsVoiceTest (~110), BatchTest (~100)
          - shard: 4
            part: 0
            classes: com.elad.faceblur.ProjectsVoiceTest,com.elad.faceblur.BatchTest
            selftest: 0
    name: e2e (shard ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: test-apks
          path: app/build/outputs/apk

      - run: find app/build/outputs/apk -name '*.apk'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_KEY }}

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_CLASSES: ${{ matrix.classes }}
          E2E_SELFTEST: ${{ matrix.selftest }}
          E2E_SHARDS: 2
          E2E_SHARD: ${{ matrix.part }}
          E2E_FULL: ${{ needs.plan.outputs.e2e_full }}
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash ci/e2e.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e-results
          retention-days: 14
          if-no-files-found: ignore

  # Release only what passed the emulator end-to-end test (and every other job above). Never in a
  # test-only run.
  publish:
    needs: [plan, build-release, android, e2e]
    if: needs.plan.outputs.mode == 'full' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # ci/release-guard.sh
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: out

      # The version plan computed may have been taken since: by a newer run that queued behind this
      # one, when this run's publish failed and only it is re-run ("Re-run failed jobs" skips plan's
      # checks). Then this run publishes nothing and fails, and never updates the other's release.
      - name: The version is still this run's
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/release-guard.sh new "v$VERSION"

      # GitHub has refused a create for a moment ("Resource not accessible by integration", run
      # 45919424342): a failed first try gets one more, a minute later, only while the tag is free
      # or the first try's own.
      - name: Publish release
        id: release1
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &release
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ONIT ${{ env.VERSION }}
          body: "ONIT ${{ env.VERSION }}, build ${{ github.run_number }} (the Android versionCode). APK for arm64 (vivo X300 Pro). Commit ${{ github.sha }}"
          files: out/*.apk
          make_latest: true
          generate_release_notes: true

      - name: Wait, then check the tag again
        if: steps.release1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          bash ci/release-guard.sh retry "v$VERSION"

      - name: Publish release (second try)
        if: steps.release1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *release

      # The beta's release names its RC (this run, its hash): main's plan job reads both.
      - uses: actions/download-artifact@v7
        if: github.ref == 'refs/heads/develop'
        with:
          name: release-candidate
          path: rc

      - name: Release candidate
        id: rc
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          set -euo pipefail
          [ "$(find rc -type f | wc -l)" = 1 ]
          echo "sha256=$(sha256sum rc/*.apk | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Publish beta
        id: beta1
        if: github.ref == 'refs/heads/develop'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with: &beta
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ONIT Beta ${{ env.VERSION }}
          body: |
            Beta ${{ env.VERSION }} from develop (installs beside ONIT as "ONIT Beta"), build ${{ github.run_number }}. Commit ${{ github.sha }}

            rc-run: ${{ github.run_id }}
            rc-sha256: ${{ steps.rc.outputs.sha256 }}
          files: out/*.apk
          prerelease: true
          make_latest: false

      - name: Wait, then check the tag again
        if: steps.beta1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          bash ci/release-guard.sh retry "v$VERSION"

      - name: Publish beta (second try)
        if: steps.beta1.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with: *beta
