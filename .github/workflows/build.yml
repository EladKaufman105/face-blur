name: Build APK

on:
  push:
    branches: [main]
    # The web app has its own workflow.
    paths-ignore: ['.github/workflows/models.yml', '.github/workflows/web.yml', 'web/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Release only what passed the emulator end-to-end test.
  build:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        shell: bash
        run: |
          bash ci/fetch-whisper.sh
          bash ci/fetch-opencv.sh
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ONIT-${{ github.run_number }}.apk"

      - name: APK size
        shell: bash
        run: |
          ls -l out/*.apk
          unzip -lv out/*.apk | sort -k3 -n -r | head -15

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ONIT ${{ github.run_number }}
          body: "APK for arm64 (vivo X300 Pro). Commit ${{ github.sha }}"
          files: out/*.apk
          make_latest: true

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f build.log
          git commit -m "build log ${{ github.run_number }}" > /dev/null
          git push -f origin ci-log

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch test media
        shell: bash
        run: |
          git fetch --depth 1 origin test-media
          mkdir -p app/src/androidTest/assets/samples
          git archive FETCH_HEAD | tar -x -C app/src/androidTest/assets/samples
          ls -la app/src/androidTest/assets/samples
          # Whisper "tiny" (MIT) for the subtitles test.
          mkdir -p app/src/androidTest/assets/models
          curl -sSfL --retry 3 -o app/src/androidTest/assets/models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          # The speaker model (WeSpeaker, CC BY 4.0), as the app downloads it.
          curl -sSfL --retry 3 -o app/src/androidTest/assets/models/speaker.onnx \
            https://raw.githubusercontent.com/EladKaufman105/face-blur/speaker-model/speaker-wespeaker-r34lm-fp16.onnx
          # Background removal's second model (LR-ASPP, BSD-3), as the app downloads it.
          for m in lraspp_mbv3_512x288_fp16.onnx lraspp_mbv3_288x512_fp16.onnx; do
            curl -sSfL --retry 3 -o app/src/androidTest/assets/models/$m \
              https://raw.githubusercontent.com/EladKaufman105/face-blur/187ecd0f0bdb7e082b132a0e844e3a6785fb463b/seg/$m
          done
          ls -la app/src/androidTest/assets/models
          bash ci/fetch-whisper.sh
          bash ci/fetch-opencv.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APKs (x86_64)
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          # The release build too (minified by R8): CI runs its self-test after the tests.
          ./gradlew assembleDebug assembleDebugAndroidTest assembleRelease -PabiFilters=x86_64 --no-daemon --stacktrace 2>&1 | tee e2e-build.log

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/e2e.sh

      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p e2e-results
          cp e2e-build.log e2e-results/ 2>/dev/null || true
          cd e2e-results
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "e2e results ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
